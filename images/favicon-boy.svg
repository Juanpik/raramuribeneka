<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Subtle white glow/outline so it never gets lost on dark mode tabs -->
  <path d="M7 11 C7 5 11 2 17 2 C21 2 23 4 25 7 C27 7 28 9 28 12 C28 17 26 25 21 27 C17 29 11 28 8 25 C5 22 5 16 7 11 Z" 
        fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Left ribbons of the koyera -->
  <path d="M6 14 L1 19 L3 23 L8 18 Z" fill="#C20E22" stroke="#1A1816" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M4 21 L5 27 L8 26 L7 20 Z" fill="#C20E22" stroke="#1A1816" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Black hair silhouette -->
  <!-- Top hair bumps + side hair -->
  <path d="M8 12 C8 6 12 3 17 3 C20 3 22 4.5 24 7 C26 7 27 9 27 12 C27 18 25 24 20 26 C16 27.5 11 26.5 8.5 24 C6.5 21.5 6.5 16 8 12 Z" 
        fill="#1A1816"/>
  
  <!-- Warm face skin (caramel) -->
  <path d="M9 16 C9 15 11 14 17 14 C23 14 25 15 25 16 C25 22 23 25 17 25 C11 25 9 22 9 16 Z" 
        fill="#C47E4C" stroke="#1A1816" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Red Koyera (Headband) -->
  <path d="M7 11 L27 9.5 L26 15 L6.5 16.5 Z" 
        fill="#C20E22" stroke="#1A1816" stroke-width="1.2" stroke-linejoin="round"/>
  
  <!-- Facial features -->
  <!-- Eyes -->
  <ellipse cx="13" cy="18" rx="1.3" ry="1.6" fill="#1A1816"/>
  <circle cx="12.6" cy="17.4" r="0.5" fill="#FFFFFF"/>
  
  <ellipse cx="21" cy="18" rx="1.3" ry="1.6" fill="#1A1816"/>
  <circle cx="20.6" cy="17.4" r="0.5" fill="#FFFFFF"/>
  
  <!-- Nose (subtle arc) -->
  <path d="M16 20 Q17 21 18 20" fill="none" stroke="#1A1816" stroke-width="1" stroke-linecap="round"/>

  <!-- Smiling mouth -->
  <path d="M13.5 21.5 Q17 25 20.5 21.5" fill="none" stroke="#1A1816" stroke-width="1.4" stroke-linecap="round"/>
</svg>